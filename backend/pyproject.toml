[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-saas-starter"
version = "1.0.0"
description = "Multi-tenant SaaS backend: organisations, roles, plans and metered quotas."
requires-python = ">=3.12"

dependencies = [
    "Django>=6.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.4",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "stripe>=11",
    "gunicorn>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.setuptools.packages.find]
include = ["accounts*", "orgs*", "billing*", "config*"]
